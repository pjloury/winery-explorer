<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napa &amp; Sonoma Winery Explorer</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;%F0%9F%8D%B7&lt;/text&gt;&lt;/svg&gt;">
<meta name="description" content="Explore 88 top Napa &amp; Sonoma wineries — founding stories, the Wine Spectator Top 100, an interactive map, corporate lineage, and standout architecture.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://winery-explorer.vercel.app/">
<meta property="og:title" content="Napa &amp; Sonoma Winery Explorer">
<meta property="og:description" content="88 top estates — Wine Spectator Top 100, an interactive map, lineage & architecture.">
<meta property="og:image" content="https://winery-explorer.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Napa &amp; Sonoma Winery Explorer">
<meta name="twitter:description" content="88 top estates — Wine Spectator Top 100, an interactive map, lineage & architecture.">
<meta name="twitter:image" content="https://winery-explorer.vercel.app/og.jpg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🍷 Napa &amp; Sonoma Winery Explorer</h1>
  <p class="subtitle">The top estates of both valleys — founding stories, consolidations &amp; resurrections, famous bottles, vibes, and what a visit costs. Prices and fees are approximate; verify before visiting.</p>
  <div class="controls">
    <span class="view-toggle">
      <button data-view="table" class="active">Table</button>
      <button data-view="map">Map</button>
      <button data-view="awards">Top Wines</button>
      <button data-view="lineage">Lineage</button>
    </span>
    <span class="seg">
      <button class="chip active" data-valley="All">Both valleys</button>
      <button class="chip napa" data-valley="Napa">Napa</button>
      <button class="chip sonoma" data-valley="Sonoma">Sonoma</button>
    </span>
    <input id="search" type="search" placeholder="Search wines, history, vibe…">
    <span class="count"></span>
  </div>
</header>

<main>
  <div id="table-view" class="view active"></div>
  <div id="map-view" class="view">
    <div id="map-filters" class="map-filters"></div>
    <div class="map-legend">
      <span><span class="lg-star">★</span> Top 25</span>
      <span><span class="lg-flower">✿</span> Gardens</span>
      <span><span class="lg-ring modern"></span> Modern arch.</span>
      <span><span class="lg-ring classic"></span> Classic arch.</span>
      <span style="color:var(--muted)">hover a pin for the story</span>
    </div>
    <div class="map-stage">
      <div id="map"></div>
      <div id="map-index" class="map-index"></div>
    </div>
  </div>
  <div id="awards-view" class="view"><div id="awards"></div></div>
  <div id="lineage-view" class="view"><div id="lineage"></div></div>
</main>

<div id="overlay"></div>
<aside id="drawer" aria-label="Winery details"></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script src="awards.js"></script>
<script src="manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
