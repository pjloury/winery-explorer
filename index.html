<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napa &amp; Sonoma Wineries</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;%F0%9F%8D%B7&lt;/text&gt;&lt;/svg&gt;">
<meta name="description" content="Explore 88 top Napa &amp; Sonoma wineries — founding stories, the Wine Spectator Top 100, an interactive map, corporate lineage, and standout architecture.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://winery-explorer.vercel.app/">
<meta property="og:title" content="Napa &amp; Sonoma Wineries">
<meta property="og:description" content="88 top estates — Wine Spectator Top 100, an interactive map, lineage & architecture.">
<meta property="og:image" content="https://winery-explorer.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Napa &amp; Sonoma Wineries">
<meta name="twitter:description" content="88 top estates — Wine Spectator Top 100, an interactive map, lineage & architecture.">
<meta name="twitter:image" content="https://winery-explorer.vercel.app/og.jpg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🍷 Napa &amp; Sonoma Wineries</h1>
  <p class="subtitle">The top estates of both valleys — from founding stories to famous bottles.</p>
</header>
<div class="controls">
  <button class="icon-btn hamburger" id="nav-toggle" aria-label="Switch view" aria-expanded="false">☰</button>
  <span class="view-toggle">
    <button data-view="table" class="active">Table</button>
    <button data-view="map">Map</button>
    <button data-view="awards">Top Wines</button>
    <button data-view="lineage">Lineage</button>
  </span>
  <span class="seg valleys">
    <button class="chip napa active" data-valley="Napa">Napa</button>
    <button class="chip sonoma active" data-valley="Sonoma">Sonoma</button>
  </span>
  <button class="icon-btn search-toggle" id="search-toggle" aria-label="Search" aria-expanded="false">🔍</button>
  <input id="search" type="search" placeholder="Search wines, history, vibe…">
  <span class="count"></span>
</div>

<main>
  <div id="table-view" class="view active"></div>
  <div id="map-view" class="view">
    <div id="map-filters" class="map-filters"></div>
    <div class="map-legend">
      <span><span class="lg-ring top"></span> Top 25</span>
      <span><span class="lg-flower">✿</span> Gardens</span>
      <span>📖 New Arch<span class="lg-suffix">itecture</span></span>
      <span><span class="lg-ring classic"></span> Classic<span class="lg-suffix"> arch.</span></span>
    </div>
    <div class="map-stage">
      <div class="map-shell">
        <div id="map"></div>
        <button id="map-recenter" class="map-recenter" aria-label="Re-center map" title="Re-center map">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="6"></circle>
            <line x1="12" y1="1.5" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22.5"></line>
            <line x1="1.5" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22.5" y2="12"></line>
          </svg>
        </button>
        <div id="map-focus-card" class="map-focus-card"></div>
      </div>
      <div id="map-index" class="map-index"></div>
    </div>
  </div>
  <div id="awards-view" class="view"><div id="awards"></div></div>
  <div id="lineage-view" class="view"><div id="lineage"></div></div>
</main>

<div id="overlay"></div>
<aside id="drawer" aria-label="Winery details"></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script src="awards.js"></script>
<script src="taglines.js"></script>
<script src="manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
